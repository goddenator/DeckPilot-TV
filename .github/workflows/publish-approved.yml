name: Publish owner-approved update
on:
  pull_request:
    types: [labeled]
    branches: [main]
  workflow_dispatch:
    inputs:
      commit:
        description: Exact reviewed 40-character commit SHA
        required: true
      mode:
        description: Preflight never creates a tag or release
        type: choice
        options: [preflight, publish]
        default: preflight
      channel:
        type: choice
        options: [preview, stable]
        default: preview
permissions:
  contents: read
  actions: read
jobs:
  guard:
    if: github.event_name == 'workflow_dispatch' || ((github.event.label.name == 'deckpilot:publish-preview' || github.event.label.name == 'deckpilot:preflight-preview') && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.guard.outputs.sha }}
      channel: ${{ steps.guard.outputs.channel }}
      mode: ${{ steps.guard.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/github-script@v7
        id: guard
        with:
          script: |
            const {guard} = require('./.github/scripts/publication-guard.cjs');
            await guard(github, context, core);
  publish:
    needs: guard
    runs-on: ubuntu-latest
    environment: deckpilot-${{ needs.guard.outputs.channel }}-publish
    permissions:
      contents: write
      pull-requests: read
      actions: read
    concurrency: deckpilot-publish
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.guard.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Revalidate approval and current PR head
        uses: actions/github-script@v7
        env:
          APPROVED_SHA: ${{ needs.guard.outputs.sha }}
          APPROVED_CHANNEL: ${{ needs.guard.outputs.channel }}
          APPROVED_MODE: ${{ needs.guard.outputs.mode }}
        with:
          script: |
            const {revalidate} = require('./.github/scripts/publication-guard.cjs');
            await revalidate(github, context, {sha:process.env.APPROVED_SHA, channel:process.env.APPROVED_CHANNEL, mode:process.env.APPROVED_MODE});
      - name: Verify reviewed build
        run: |
          node --test .github/scripts/publication-guard.test.cjs
          python3 -m unittest discover -s app -v
          npm --prefix decky ci
          npm --prefix decky run typecheck
          npm --prefix decky run build
          cd decky
          npx playwright install --with-deps chromium
          npm run test:ui
      - name: Package paired components
        run: python3 tools/package_release.py
      - name: Non-publishing publication preflight
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED_SHA: ${{ needs.guard.outputs.sha }}
          APPROVED_CHANNEL: ${{ needs.guard.outputs.channel }}
        run: python3 tools/publish_approved.py --preflight
      - name: Publish verified immutable pair
        if: needs.guard.outputs.mode == 'publish'
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED_SHA: ${{ needs.guard.outputs.sha }}
          APPROVED_CHANNEL: ${{ needs.guard.outputs.channel }}
        run: python3 tools/publish_approved.py
