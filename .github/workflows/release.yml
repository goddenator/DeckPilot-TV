name: Build DeckPilot releases
on:
  pull_request:
    branches: [main]
  push:
    branches: ['feature/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test Python app
        run: |
          cd app
          python3 -m unittest discover -v
          bash -n install.sh setup_drive.sh uninstall.sh
      - name: Build Decky frontend
        run: |
          cd decky
          npm ci
          npm run typecheck
          npm run build
          test -s dist/index.js
      - name: Test Decky screens
        working-directory: decky
        run: |
          npx playwright install --with-deps chromium
          npm run test:ui
      - name: Assemble release assets
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            python3 tools/package_release.py --version "${GITHUB_REF_NAME#v}"
          else
            python3 tools/package_release.py
          fi
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deckpilot-build
          path: out/*
